name: ZEUS CI

# Run this matrix against the current stacked PR base and head.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository:
    name: Repository structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify repository structure
        run: bash scripts/verify-repository.sh

  web-admin:
    name: Web admin build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web-admin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install pinned dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test certificate lifecycle rules
        run: npm test
      - name: Build SPA
        run: npm run build

  control-plane:
    name: Go control plane tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zeus_test
          POSTGRES_PASSWORD: zeus_ci_only_password
          POSTGRES_DB: zeus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zeus_test -d zeus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ZEUS_DATABASE_URL: postgres://zeus_test:zeus_ci_only_password@127.0.0.1:5432/zeus_test?sslmode=disable
      ZEUS_TEST_DATABASE_URL: postgres://zeus_test:zeus_ci_only_password@127.0.0.1:5432/zeus_test?sslmode=disable
      ZEUS_E2E_TEST_DATABASE_URL: postgres://zeus_test:zeus_ci_only_password@127.0.0.1:5432/zeus_test?sslmode=disable
      ZEUS_E2E_DATABASE_IS_DISPOSABLE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4'
          cache-dependency-path: services/control-plane/go.mod
      - name: Resolve and verify pinned Go dependencies
        working-directory: services/control-plane
        run: go mod tidy
      - name: Apply versioned database migrations
        working-directory: services/control-plane
        run: go run ./cmd/zeus-migrate
      - name: Test
        working-directory: services/control-plane
        run: go test -race ./...
      - name: Vet
        working-directory: services/control-plane
        run: go vet ./...

  android:
    name: Android debug build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build Android app and run unit tests
        env:
          ZEUS_API_BASE_URL: ${{ vars.ZEUS_API_BASE_URL }}
          ZEUS_OIDC_ISSUER: ${{ vars.ZEUS_OIDC_ISSUER }}
          ZEUS_OIDC_CLIENT_ID: ${{ vars.ZEUS_OIDC_CLIENT_ID }}
        run: |
          build_args=()
          if [[ -n "$ZEUS_API_BASE_URL" ]]; then build_args+=("-PZEUS_API_BASE_URL=$ZEUS_API_BASE_URL"); fi
          if [[ -n "$ZEUS_OIDC_ISSUER" ]]; then build_args+=("-PZEUS_OIDC_ISSUER=$ZEUS_OIDC_ISSUER"); fi
          if [[ -n "$ZEUS_OIDC_CLIENT_ID" ]]; then build_args+=("-PZEUS_OIDC_CLIENT_ID=$ZEUS_OIDC_CLIENT_ID"); fi

          configured_count=0
          for value in "$ZEUS_API_BASE_URL" "$ZEUS_OIDC_ISSUER" "$ZEUS_OIDC_CLIENT_ID"; do
            if [[ -n "$value" ]]; then
              configured_count=$((configured_count + 1))
            fi
          done
          if [[ "$configured_count" -ne 0 && "$configured_count" -ne 3 ]]; then
            echo "Set all three ZEUS GitHub repository variables together, or leave all three empty."
            exit 1
          fi

          ./gradlew --no-daemon :apps:android:assembleDebug :apps:android:testDebugUnitTest "${build_args[@]}"
      - name: Upload debug APK and unit-test report
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zeus-vpn-android-debug
          path: |
            apps/android/build/outputs/apk/debug/*.apk
            apps/android/build/reports/tests/testDebugUnitTest/
          if-no-files-found: error
          retention-days: 7


  android-package-visibility:
    name: Android Package Visibility emulator test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android SDK and API 35 emulator image
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "emulator" "system-images;android-35;google_apis;x86_64"
      - name: Create isolated emulator
        run: |
          echo "no" | avdmanager create avd -n zeus-api35 -k "system-images;android-35;google_apis;x86_64" --device "pixel_2"
          emulator -avd zeus-api35 -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot-save > zeus-emulator.log 2>&1 &
          adb wait-for-device
          for attempt in $(seq 1 60); do
            boot_completed="$(adb shell getprop sys.boot_completed | tr -d '\r')"
            if [[ "$boot_completed" == "1" ]]; then break; fi
            sleep 5
          done
          test "$boot_completed" = "1"
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
      - name: Generate a distinct fixture signing key
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/zeus-fixture.jks" -storepass fixture-only-password -alias fixture -keypass fixture-only-password -dname "CN=ZEUS Package Visibility Fixture" -keyalg RSA -keysize 2048 -validity 2
      - name: Build target app, instrumentation APK, and hidden fixture
        run: |
          ./gradlew --no-daemon \
            -PFIXTURE_KEYSTORE_PATH="$RUNNER_TEMP/zeus-fixture.jks" \
            -PFIXTURE_KEYSTORE_PASSWORD=fixture-only-password \
            :apps:android:assembleDebug \
            :apps:android:assembleDebugAndroidTest \
            :apps:android-visibility-fixture:assembleDebug
      - name: Install fixture and target APKs
        run: |
          adb install -r apps/android-visibility-fixture/build/outputs/apk/debug/android-visibility-fixture-debug.apk
          adb install -r apps/android/build/outputs/apk/debug/app-debug.apk
          fixture_path="$(adb shell pm path com.zeusvpn.visibilityfixture | tr -d '\r')"
          target_path="$(adb shell pm path com.zeusvpn.app.diagnostics | tr -d '\r')"
          test -n "$fixture_path"
          test -n "$target_path"
          echo "Installed fixture: $fixture_path"
          echo "Installed target: $target_path"
      - name: Run real PackageManager visibility instrumentation test
        run: |
          adb install -r apps/android/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          set -o pipefail
          adb shell am instrument -w -e class com.zeusvpn.app.vpn.PackageVisibilityInstrumentedTest com.zeusvpn.app.diagnostics.test/androidx.test.runner.AndroidJUnitRunner | tee zeus-instrumentation.log
          grep -Fq 'OK (1 test)' zeus-instrumentation.log
      - name: Upload emulator diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zeus-package-visibility-emulator-diagnostics
          path: |
            zeus-emulator.log
            zeus-instrumentation.log
          if-no-files-found: ignore
          retention-days: 7

  vpn-node:
    name: VPN node agent and executor tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/vpn-node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4'
          cache-dependency-path: services/vpn-node/go.mod
      - name: Verify Go formatting
        run: |
          files="$(gofmt -l .)"
          if [[ -n "$files" ]]; then
            echo "Files requiring gofmt:"
            echo "$files"
            gofmt -d $files
            exit 1
          fi
      - name: Test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
