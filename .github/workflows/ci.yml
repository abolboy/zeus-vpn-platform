name: ZEUS CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository:
    name: Repository structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify repository structure
        run: bash scripts/verify-repository.sh

  control-plane:
    name: Go control plane tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache-dependency-path: services/control-plane/go.mod
      - name: Test
        working-directory: services/control-plane
        run: go test -race ./...
      - name: Vet
        working-directory: services/control-plane
        run: go vet ./...

  android:
    name: Android debug build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses
      - name: Install Android SDK
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew --no-daemon :apps:android:assembleDebug :apps:android:testDebugUnitTest
