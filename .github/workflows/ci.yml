name: ZEUS CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository:
    name: Repository structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify repository structure
        run: bash scripts/verify-repository.sh

  web-admin:
    name: Web admin build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Build SPA
        run: npm run build

  control-plane:
    name: Go control plane tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zeus_test
          POSTGRES_PASSWORD: zeus_ci_only_password
          POSTGRES_DB: zeus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zeus_test -d zeus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ZEUS_DATABASE_URL: postgres://zeus_test:zeus_ci_only_password@127.0.0.1:5432/zeus_test?sslmode=disable
      ZEUS_TEST_DATABASE_URL: postgres://zeus_test:zeus_ci_only_password@127.0.0.1:5432/zeus_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache-dependency-path: services/control-plane/go.mod
      - name: Resolve and verify pinned Go dependencies
        working-directory: services/control-plane
        run: go mod tidy
      - name: Apply versioned database migrations
        working-directory: services/control-plane
        run: go run ./cmd/zeus-migrate
      - name: Test
        working-directory: services/control-plane
        run: go test -race ./...
      - name: Vet
        working-directory: services/control-plane
        run: go vet ./...

  android:
    name: Android debug build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build Android app and run unit tests
        run: ./gradlew --no-daemon :apps:android:assembleDebug :apps:android:testDebugUnitTest

  vpn-node:
    name: VPN node agent and executor tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/vpn-node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache-dependency-path: services/vpn-node/go.mod
      - name: Verify Go formatting
        run: |
          files="$(gofmt -l .)"
          if [[ -n "$files" ]]; then
            echo "Files requiring gofmt:"
            echo "$files"
            gofmt -d $files
            exit 1
          fi
      - name: Test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
