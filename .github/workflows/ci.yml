name: ZEUS CI

# Run this matrix against the current stacked PR base and head.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository:
    name: Repository structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify repository structure
        run: bash scripts/verify-repository.sh

  web-admin:
    name: Web admin build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web-admin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install pinned dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test certificate lifecycle rules
        run: npm test
      - name: Build SPA
        run: npm run build

  control-plane:
    name: Go control plane tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zeus_test
          POSTGRES_PASSWORD: zeus_ci_only_password
          POSTGRES_DB: zeus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zeus_test -d zeus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ZEUS_DATABASE_URL: postgres://zeus_test:zeus_ci_only_password@127.0.0.1:5432/zeus_test?sslmode=disable
      ZEUS_TEST_DATABASE_URL: postgres://zeus_test:zeus_ci_only_password@127.0.0.1:5432/zeus_test?sslmode=disable
      ZEUS_E2E_TEST_DATABASE_URL: postgres://zeus_test:zeus_ci_only_password@127.0.0.1:5432/zeus_test?sslmode=disable
      ZEUS_E2E_DATABASE_IS_DISPOSABLE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4'
          cache-dependency-path: services/control-plane/go.mod
      - name: Resolve and verify pinned Go dependencies
        working-directory: services/control-plane
        run: go mod tidy
      - name: Apply versioned database migrations
        working-directory: services/control-plane
        run: go run ./cmd/zeus-migrate
      - name: Test
        working-directory: services/control-plane
        run: go test -race ./...
      - name: Vet
        working-directory: services/control-plane
        run: go vet ./...

  android:
    name: Android debug build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android SDK API 37.2
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager_path="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$sdkmanager_path"
          yes | "$sdkmanager_path" --licenses >/dev/null
          "$sdkmanager_path" --install "platforms;android-37.2" "build-tools;37.0.0"
      - name: Build Android debug APK
        env:
          ZEUS_API_BASE_URL: ${{ vars.ZEUS_API_BASE_URL }}
          ZEUS_OIDC_ISSUER: ${{ vars.ZEUS_OIDC_ISSUER }}
          ZEUS_OIDC_CLIENT_ID: ${{ vars.ZEUS_OIDC_CLIENT_ID }}
        run: |
          build_args=()
          if [[ -n "$ZEUS_API_BASE_URL" ]]; then build_args+=("-PZEUS_API_BASE_URL=$ZEUS_API_BASE_URL"); fi
          if [[ -n "$ZEUS_OIDC_ISSUER" ]]; then build_args+=("-PZEUS_OIDC_ISSUER=$ZEUS_OIDC_ISSUER"); fi
          if [[ -n "$ZEUS_OIDC_CLIENT_ID" ]]; then build_args+=("-PZEUS_OIDC_CLIENT_ID=$ZEUS_OIDC_CLIENT_ID"); fi

          configured_count=0
          for value in "$ZEUS_API_BASE_URL" "$ZEUS_OIDC_ISSUER" "$ZEUS_OIDC_CLIENT_ID"; do
            if [[ -n "$value" ]]; then
              configured_count=$((configured_count + 1))
            fi
          done
          if [[ "$configured_count" -ne 0 && "$configured_count" -ne 3 ]]; then
            echo "Set all three ZEUS GitHub repository variables together, or leave all three empty."
            exit 1
          fi

          ./gradlew --no-daemon :apps:android:assembleDebug "${build_args[@]}"
      - name: Run Android unit tests (including Tor SOCKS endpoint regression tests)
        env:
          ZEUS_API_BASE_URL: ${{ vars.ZEUS_API_BASE_URL }}
          ZEUS_OIDC_ISSUER: ${{ vars.ZEUS_OIDC_ISSUER }}
          ZEUS_OIDC_CLIENT_ID: ${{ vars.ZEUS_OIDC_CLIENT_ID }}
        run: |
          build_args=()
          if [[ -n "$ZEUS_API_BASE_URL" ]]; then build_args+=("-PZEUS_API_BASE_URL=$ZEUS_API_BASE_URL"); fi
          if [[ -n "$ZEUS_OIDC_ISSUER" ]]; then build_args+=("-PZEUS_OIDC_ISSUER=$ZEUS_OIDC_ISSUER"); fi
          if [[ -n "$ZEUS_OIDC_CLIENT_ID" ]]; then build_args+=("-PZEUS_OIDC_CLIENT_ID=$ZEUS_OIDC_CLIENT_ID"); fi

          configured_count=0
          for value in "$ZEUS_API_BASE_URL" "$ZEUS_OIDC_ISSUER" "$ZEUS_OIDC_CLIENT_ID"; do
            if [[ -n "$value" ]]; then
              configured_count=$((configured_count + 1))
            fi
          done
          if [[ "$configured_count" -ne 0 && "$configured_count" -ne 3 ]]; then
            echo "Set all three ZEUS GitHub repository variables together, or leave all three empty."
            exit 1
          fi

          ./gradlew --no-daemon :apps:android:testDebugUnitTest "${build_args[@]}"
      - name: Upload debug APK and unit-test report
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zeus-vpn-android-debug
          path: |
            apps/android/build/outputs/apk/debug/*.apk
            apps/android/build/reports/tests/testDebugUnitTest/
          if-no-files-found: error
          retention-days: 7


  android-package-visibility:
    name: Android Package Visibility emulator test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android SDK and API 35 emulator image
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager_path="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$sdkmanager_path"
          tools_directory="$(dirname "$sdkmanager_path")"
          echo "$tools_directory" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          export PATH="$tools_directory:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          yes | "$sdkmanager_path" --licenses >/dev/null
          "$sdkmanager_path" --install "platform-tools" "platforms;android-37.2" "build-tools;37.0.0" "emulator" "system-images;android-35;google_apis;x86_64"
      - name: Grant runner access to KVM
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [[ ! -c /dev/kvm ]]; then
            echo "::error::GitHub runner does not expose the KVM device required by the x86_64 Android emulator."
            exit 1
          fi
          sudo chown "$USER" /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          "$sdk_root/emulator/emulator" -accel-check

      - name: Create isolated emulator
        run: |
          if ! timeout 300s bash -c '
            set -euo pipefail
            export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
            export ANDROID_SDK_ROOT="$ANDROID_HOME"
            export ANDROID_AVD_HOME="$HOME/.android/avd"
            mkdir -p "$ANDROID_AVD_HOME"

            if ! printf "no\\n" | timeout 90s avdmanager --verbose create avd --force -n zeus-api35 -k "system-images;android-35;google_apis;x86_64" --device "pixel_2" > zeus-avdmanager.log 2>&1; then
              cat zeus-avdmanager.log
              exit 1
            fi
            test -s "$ANDROID_AVD_HOME/zeus-api35.ini"
            test -f "$ANDROID_AVD_HOME/zeus-api35.avd/config.ini"
            avdmanager list avd | tee zeus-avd-list.log

            emulator -avd zeus-api35 -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot-save > zeus-emulator.log 2>&1 &
            timeout 180s adb wait-for-device
            boot_completed=""
            for attempt in $(seq 1 60); do
              if boot_completed="$(timeout 2s adb shell getprop sys.boot_completed | tr -d "\\r")" && [[ "$boot_completed" == "1" ]]; then
                break
              fi
              sleep 3
            done
            test "$boot_completed" = "1"
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
          '; then
            echo "Android AVD creation and boot did not complete within the 5-minute deadline."
            adb devices -l || true
            timeout 15s adb logcat -d -t 300 > zeus-logcat.txt 2>&1 || true
            tail -n 200 zeus-avdmanager.log || true
            tail -n 200 zeus-avd-list.log || true
            tail -n 200 zeus-emulator.log || true
            exit 1
          fi
      - name: Generate a distinct fixture signing key
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/zeus-fixture.jks" -storepass fixture-only-password -alias fixture -keypass fixture-only-password -dname "CN=ZEUS Package Visibility Fixture" -keyalg RSA -keysize 2048 -validity 2
      - name: Build target app, instrumentation APK, and hidden fixture
        run: |
          ./gradlew --no-daemon \
            -PFIXTURE_KEYSTORE_PATH="$RUNNER_TEMP/zeus-fixture.jks" \
            -PFIXTURE_KEYSTORE_PASSWORD=fixture-only-password \
            :apps:android:assembleDebug \
            :apps:android:assembleDebugAndroidTest \
            :apps:android-visibility-fixture:assembleDebug
      - name: Install fixture and target APKs
        run: |
          fixture_apk="$(find apps/android-visibility-fixture/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          target_apk="$(find apps/android/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [[ -z "$fixture_apk" || -z "$target_apk" ]]; then
            echo "::error::Expected fixture or target APK was not produced."
            find apps/android-visibility-fixture/build/outputs/apk apps/android/build/outputs/apk -type f -name '*.apk' -print || true
            exit 1
          fi
          echo "Installing fixture APK: $fixture_apk"
          adb install -r "$fixture_apk"
          echo "Installing target APK: $target_apk"
          adb install -r "$target_apk"
          fixture_path="$(adb shell pm path com.zeusvpn.visibilityfixture | tr -d '\r')"
          target_path="$(adb shell pm path com.zeusvpn.app.diagnostics | tr -d '\r')"
          test -n "$fixture_path"
          test -n "$target_path"
          echo "Installed fixture: $fixture_path"
          echo "Installed target: $target_path"
      - name: Run real PackageManager visibility instrumentation test
        run: |
          android_test_apk="$(find apps/android/build/outputs/apk/androidTest/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [[ -z "$android_test_apk" ]]; then
            echo "::error::Android instrumentation APK was not produced."
            find apps/android/build/outputs/apk -type f -name '*.apk' -print || true
            exit 1
          fi
          echo "Installing instrumentation APK: $android_test_apk"
          adb install -r "$android_test_apk"
          set -o pipefail
          adb shell am instrument -w -e class com.zeusvpn.app.vpn.PackageVisibilityInstrumentedTest com.zeusvpn.app.diagnostics.test/androidx.test.runner.AndroidJUnitRunner | tee zeus-instrumentation.log
          grep -Fq 'OK (1 test)' zeus-instrumentation.log
      - name: Upload emulator diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zeus-package-visibility-emulator-diagnostics
          path: |
            zeus-avdmanager.log
            zeus-avd-list.log
            zeus-emulator.log
            zeus-logcat.txt
            zeus-instrumentation.log
          if-no-files-found: ignore
          retention-days: 7

  vpn-node:
    name: VPN node agent and executor tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/vpn-node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4'
          cache-dependency-path: services/vpn-node/go.mod
      - name: Verify Go formatting
        run: |
          files="$(gofmt -l .)"
          if [[ -n "$files" ]]; then
            echo "Files requiring gofmt:"
            echo "$files"
            gofmt -d $files
            exit 1
          fi
      - name: Test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
