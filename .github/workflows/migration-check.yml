name: ZEUS Database Migration Check

on:
  push:
    paths:
      - "services/control-plane/migrations/**"
      - ".github/workflows/migration-check.yml"
  pull_request:
    paths:
      - "services/control-plane/migrations/**"
      - ".github/workflows/migration-check.yml"

permissions:
  contents: read

jobs:
  postgres-migration:
    name: PostgreSQL schema migration
    runs-on: ubuntu-latest
    env:
      ZEUS_DATABASE_URL: postgres://zeus_test:zeus_ci_only_password@127.0.0.1:5432/zeus_test?sslmode=disable
      PGPASSWORD: zeus_ci_only_password
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zeus_test
          POSTGRES_PASSWORD: zeus_ci_only_password
          POSTGRES_DB: zeus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zeus_test -d zeus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4'
          cache-dependency-path: services/control-plane/go.mod
      - name: Resolve and verify pinned Go dependencies
        working-directory: services/control-plane
        run: go mod tidy
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Create isolated least-privilege database roles
        run: |
          psql "$ZEUS_DATABASE_URL" --no-psqlrc --set=ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE zeus_migrator LOGIN PASSWORD 'zeus_ci_migrator_password'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS NOINHERIT;
          CREATE ROLE zeus_app LOGIN PASSWORD 'zeus_ci_app_password'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS NOINHERIT;
          GRANT CONNECT ON DATABASE zeus_test TO zeus_migrator, zeus_app;
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          GRANT USAGE, CREATE ON SCHEMA public TO zeus_migrator;
          CREATE TABLE public.zeus_preexisting_privilege_probe (id BIGSERIAL PRIMARY KEY);
          GRANT ALL PRIVILEGES ON TABLE public.zeus_preexisting_privilege_probe TO zeus_app;
          GRANT ALL PRIVILEGES ON SEQUENCE public.zeus_preexisting_privilege_probe_id_seq TO zeus_app;
          REVOKE ALL PRIVILEGES ON SCHEMA public FROM zeus_app;
          GRANT USAGE ON SCHEMA public TO zeus_app;
          REVOKE ALL PRIVILEGES ON ALL TABLES IN SCHEMA public FROM zeus_app;
          REVOKE ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public FROM zeus_app;
          REVOKE ALL PRIVILEGES ON ALL FUNCTIONS IN SCHEMA public FROM zeus_app;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO zeus_app;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO zeus_app;
          GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA public TO zeus_app;
          DROP TABLE public.zeus_preexisting_privilege_probe;
          ALTER ROLE zeus_migrator SET search_path = public;
          ALTER ROLE zeus_app SET search_path = public;
          ALTER DEFAULT PRIVILEGES FOR ROLE zeus_migrator IN SCHEMA public
            REVOKE ALL ON TABLES FROM zeus_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE zeus_migrator IN SCHEMA public
            REVOKE ALL ON SEQUENCES FROM zeus_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE zeus_migrator IN SCHEMA public
            REVOKE ALL ON FUNCTIONS FROM zeus_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE zeus_migrator IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO zeus_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE zeus_migrator IN SCHEMA public
            GRANT USAGE, SELECT ON SEQUENCES TO zeus_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE zeus_migrator IN SCHEMA public
            GRANT EXECUTE ON FUNCTIONS TO zeus_app;
          SQL
      - name: Apply embedded migrations twice as the dedicated migration role
        working-directory: services/control-plane
        env:
          ZEUS_DATABASE_URL: postgres://zeus_migrator:zeus_ci_migrator_password@127.0.0.1:5432/zeus_test?sslmode=disable
          PGPASSWORD: zeus_ci_migrator_password
        run: |
          go run ./cmd/zeus-migrate
          go run ./cmd/zeus-migrate
      - name: Verify runtime least privilege and migration ownership
        run: |
          runtime_url='postgres://zeus_app:zeus_ci_app_password@127.0.0.1:5432/zeus_test?sslmode=disable'
          migrator_url='postgres://zeus_migrator:zeus_ci_migrator_password@127.0.0.1:5432/zeus_test?sslmode=disable'

          identity="$(psql "$runtime_url" --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align --command='SELECT current_user')"
          test "$identity" = "zeus_app"

          privileges="$(psql "$runtime_url" --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="
            SELECT has_schema_privilege(current_user, 'public', 'USAGE')
              AND NOT has_schema_privilege(current_user, 'public', 'CREATE')
              AND NOT pg_has_role(current_user, 'zeus_migrator', 'MEMBER')
              AND NOT (SELECT rolsuper OR rolcreatedb OR rolcreaterole OR rolreplication OR rolbypassrls OR rolinherit
                       FROM pg_roles WHERE rolname = current_user)
              AND NOT has_database_privilege(current_user, current_database(), 'CREATE')
              AND NOT EXISTS (
                SELECT 1 FROM pg_sequences s
                WHERE s.schemaname = 'public'
                  AND has_sequence_privilege(current_user, format('%I.%I', s.schemaname, s.sequencename), 'UPDATE')
              )
              AND NOT EXISTS (
                SELECT 1 FROM pg_tables t
                WHERE t.schemaname = 'public'
                  AND (
                    has_table_privilege(current_user, format('%I.%I', t.schemaname, t.tablename), 'TRUNCATE')
                    OR has_table_privilege(current_user, format('%I.%I', t.schemaname, t.tablename), 'REFERENCES')
                    OR has_table_privilege(current_user, format('%I.%I', t.schemaname, t.tablename), 'TRIGGER')
                  )
              )
              AND NOT EXISTS (
                SELECT 1 FROM pg_roles
                WHERE rolname = 'zeus_migrator'
                  AND (rolsuper OR rolcreatedb OR rolcreaterole OR rolreplication OR rolbypassrls OR rolinherit)
              )
              AND NOT EXISTS (
                SELECT 1 FROM pg_auth_members m
                JOIN pg_roles member ON member.oid = m.member
                WHERE member.rolname IN ('zeus_app', 'zeus_migrator')
              )
              AND NOT EXISTS (
                SELECT 1 FROM pg_namespace n,
                     LATERAL aclexplode(COALESCE(n.nspacl, acldefault('n', n.nspowner))) acl
                WHERE n.nspname = 'public' AND acl.grantee = 0 AND acl.privilege_type = 'CREATE'
              )
              AND NOT EXISTS (
                SELECT 1 FROM pg_tables t WHERE t.schemaname = 'public' AND t.tableowner <> 'zeus_migrator'
              )
          ")"
          test "$privileges" = "t"

          if psql "$runtime_url" --no-psqlrc --set=ON_ERROR_STOP=1 --command='CREATE TABLE public.zeus_runtime_forbidden (id integer)' >/dev/null 2>&1; then
            psql "$migrator_url" --no-psqlrc --command='DROP TABLE IF EXISTS public.zeus_runtime_forbidden' >/dev/null 2>&1 || true
            echo "zeus_app unexpectedly created a table"
            exit 1
          fi

          psql "$migrator_url" --no-psqlrc --set=ON_ERROR_STOP=1 --command='CREATE TABLE public.zeus_role_privilege_probe (id BIGSERIAL PRIMARY KEY, note TEXT NOT NULL)'
          psql "$runtime_url" --no-psqlrc --set=ON_ERROR_STOP=1 --command="INSERT INTO public.zeus_role_privilege_probe (note) VALUES ('runtime grant verified')"
          psql "$runtime_url" --no-psqlrc --set=ON_ERROR_STOP=1 --command='SELECT count(*) FROM public.zeus_role_privilege_probe'
          psql "$migrator_url" --no-psqlrc --set=ON_ERROR_STOP=1 --command='DROP TABLE public.zeus_role_privilege_probe'

          echo "PASS: migrations run as zeus_migrator and are repeatable"
          echo "PASS: zeus_app cannot create schema objects"
          echo "PASS: zeus_app can use migration-created tables and sequences"
      - name: Verify all migrations, tables, constraints, and indexes
        run: |
          migrations="$(psql --host 127.0.0.1 --username zeus_test --dbname zeus_test --tuples-only --no-align --command "SELECT count(*) FROM schema_migrations WHERE version IN ('0001_initial.sql', '0002_idempotency_records.sql', '0003_node_agent_commands.sql', '0004_device_lifecycle.sql', '0005_client_enrollment_codes.sql', '0006_node_agent_certificates.sql', '0007_customer_self_service.sql', '0008_tor_client_devices.sql');")"
          test "$migrations" = "8"

          tables="$(psql --host 127.0.0.1 --username zeus_test --dbname zeus_test --tuples-only --no-align --command "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_name IN ('operators', 'operator_sessions', 'vpn_users', 'vpn_nodes', 'vpn_devices', 'wireguard_peers', 'audit_events', 'idempotency_records', 'node_commands', 'vpn_user_enrollment_codes', 'vpn_node_agent_certificates', 'client_device_idempotency_records', 'tor_client_devices', 'tor_client_enrollment_codes');")"
          test "$tables" = "14"

          columns="$(psql --host 127.0.0.1 --username zeus_test --dbname zeus_test --tuples-only --no-align --command "SELECT count(*) FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'vpn_nodes' AND column_name IN ('client_ipv4_pool', 'client_ipv6_pool', 'interface_ipv4', 'interface_ipv6');")"
          test "$columns" = "4"

          constraints="$(psql --host 127.0.0.1 --username zeus_test --dbname zeus_test --tuples-only --no-align --command "SELECT count(*) FROM pg_constraint WHERE conname IN ('vpn_nodes_client_ipv4_pool_family_check', 'vpn_nodes_client_ipv6_pool_family_check', 'vpn_nodes_interface_ipv4_pool_check', 'vpn_nodes_interface_ipv6_pool_check', 'vpn_devices_status_check');")"
          test "$constraints" = "5"

          address_indexes="$(psql --host 127.0.0.1 --username zeus_test --dbname zeus_test --tuples-only --no-align --command "SELECT count(*) FROM pg_indexes WHERE schemaname = 'public' AND indexname IN ('wireguard_peers_node_ipv4_reserved_uidx', 'wireguard_peers_node_ipv6_reserved_uidx');")"
          test "$address_indexes" = "2"

          cert_index="$(psql --host 127.0.0.1 --username zeus_test --dbname zeus_test --tuples-only --no-align --command "SELECT count(*) FROM pg_indexes WHERE schemaname = 'public' AND indexname = 'vpn_node_agent_certificates_active_node_idx';")"
          test "$cert_index" = "1"

          customer_idempotency_index="$(psql --host 127.0.0.1 --username zeus_test --dbname zeus_test --tuples-only --no-align --command "SELECT count(*) FROM pg_indexes WHERE schemaname = 'public' AND indexname = 'client_device_idempotency_expiry_idx';")"
          test "$customer_idempotency_index" = "1"

          tor_indexes="$(psql --host 127.0.0.1 --username zeus_test --dbname zeus_test --tuples-only --no-align --command "SELECT count(*) FROM pg_indexes WHERE schemaname = 'public' AND indexname IN ('tor_client_devices_user_status_idx', 'tor_client_enrollment_codes_one_active_uidx', 'tor_client_enrollment_codes_expiry_idx');")"
          test "$tor_indexes" = "3"

          tor_columns="$(psql --host 127.0.0.1 --username zeus_test --dbname zeus_test --tuples-only --no-align --command "SELECT count(*) FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'tor_client_devices' AND column_name IN ('user_id', 'device_ref', 'device_name', 'platform', 'client_version', 'status', 'created_at', 'updated_at', 'revoked_at');")"
          test "$tor_columns" = "9"

          echo "Verified $migrations migrations, $tables ZEUS tables, $columns node pool columns, $constraints constraints, $address_indexes address indexes, $cert_index certificate indexes, $customer_idempotency_index customer idempotency indexes, $tor_indexes Tor indexes, and $tor_columns Tor device columns."
