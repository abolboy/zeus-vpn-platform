name: ZEUS Database Migration Check

on:
  push:
    paths:
      - "services/control-plane/migrations/**"
      - ".github/workflows/migration-check.yml"
  pull_request:
    paths:
      - "services/control-plane/migrations/**"
      - ".github/workflows/migration-check.yml"

permissions:
  contents: read

jobs:
  postgres-migration:
    name: PostgreSQL schema migration
    runs-on: ubuntu-latest
    env:
      ZEUS_DATABASE_URL: postgres://zeus_test:zeus_ci_only_password@127.0.0.1:5432/zeus_test?sslmode=disable
      PGPASSWORD: zeus_ci_only_password
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zeus_test
          POSTGRES_PASSWORD: zeus_ci_only_password
          POSTGRES_DB: zeus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zeus_test -d zeus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4'
          cache-dependency-path: services/control-plane/go.mod
      - name: Resolve and verify pinned Go dependencies
        working-directory: services/control-plane
        run: go mod tidy
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Apply embedded migrations twice
        working-directory: services/control-plane
        run: |
          go run ./cmd/zeus-migrate
          go run ./cmd/zeus-migrate
      - name: Verify all migrations, tables, constraints, and indexes
        run: |
          migrations="$(psql --host 127.0.0.1 --username zeus_test --dbname zeus_test --tuples-only --no-align --command "SELECT count(*) FROM schema_migrations WHERE version IN ('0001_initial.sql', '0002_idempotency_records.sql', '0003_node_agent_commands.sql', '0004_device_lifecycle.sql', '0005_client_enrollment_codes.sql', '0006_node_agent_certificates.sql', '0007_customer_self_service.sql');")"
          test "$migrations" = "7"

          tables="$(psql --host 127.0.0.1 --username zeus_test --dbname zeus_test --tuples-only --no-align --command "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_name IN ('operators', 'operator_sessions', 'vpn_users', 'vpn_nodes', 'vpn_devices', 'wireguard_peers', 'audit_events', 'idempotency_records', 'node_commands', 'vpn_user_enrollment_codes', 'vpn_node_agent_certificates', 'client_device_idempotency_records');")"
          test "$tables" = "12"

          columns="$(psql --host 127.0.0.1 --username zeus_test --dbname zeus_test --tuples-only --no-align --command "SELECT count(*) FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'vpn_nodes' AND column_name IN ('client_ipv4_pool', 'client_ipv6_pool', 'interface_ipv4', 'interface_ipv6');")"
          test "$columns" = "4"

          constraints="$(psql --host 127.0.0.1 --username zeus_test --dbname zeus_test --tuples-only --no-align --command "SELECT count(*) FROM pg_constraint WHERE conname IN ('vpn_nodes_client_ipv4_pool_family_check', 'vpn_nodes_client_ipv6_pool_family_check', 'vpn_nodes_interface_ipv4_pool_check', 'vpn_nodes_interface_ipv6_pool_check', 'vpn_devices_status_check');")"
          test "$constraints" = "5"

          address_indexes="$(psql --host 127.0.0.1 --username zeus_test --dbname zeus_test --tuples-only --no-align --command "SELECT count(*) FROM pg_indexes WHERE schemaname = 'public' AND indexname IN ('wireguard_peers_node_ipv4_reserved_uidx', 'wireguard_peers_node_ipv6_reserved_uidx');")"
          test "$address_indexes" = "2"

          cert_index="$(psql --host 127.0.0.1 --username zeus_test --dbname zeus_test --tuples-only --no-align --command "SELECT count(*) FROM pg_indexes WHERE schemaname = 'public' AND indexname = 'vpn_node_agent_certificates_active_node_idx';")"
          test "$cert_index" = "1"

          customer_idempotency_index="$(psql --host 127.0.0.1 --username zeus_test --dbname zeus_test --tuples-only --no-align --command "SELECT count(*) FROM pg_indexes WHERE schemaname = 'public' AND indexname = 'client_device_idempotency_expiry_idx';")"
          test "$customer_idempotency_index" = "1"

          echo "Verified $migrations migrations, $tables ZEUS tables, $columns node pool columns, $constraints constraints, $address_indexes address indexes, $cert_index certificate indexes, and $customer_idempotency_index customer idempotency indexes."
