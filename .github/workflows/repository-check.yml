name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify repository structure
        run: bash scripts/verify-repository.sh
      - name: Set up Python for CloudFormation validation
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install pinned CloudFormation linter
        run: python -m pip install --disable-pip-version-check --no-input 'cfn-lint==1.59.0'
      - name: Validate Cognito CloudFormation template
        run: cfn-lint infra/aws-cognito/zeus-customer-user-pool.yaml
