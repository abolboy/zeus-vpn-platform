AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  ZEUS isolated staging foundation: public HTTPS ALB, private Control Plane,
  dedicated public WireGuard node, private encrypted PostgreSQL, NAT and SSM.
  This stack creates infrastructure only; it does not install or deploy ZEUS.

Parameters:
  EnvironmentName:
    Type: String
    Default: zeus-staging
    AllowedPattern: "^[a-z][a-z0-9-]{2,24}$"
    Description: Short environment prefix used in resource names.

  VpcCidr:
    Type: String
    Default: 10.240.0.0/16
    Description: Must not overlap production, office, home, or VPN client networks.

  PublicSubnet1Cidr:
    Type: String
    Default: 10.240.0.0/24
  PublicSubnet2Cidr:
    Type: String
    Default: 10.240.1.0/24
  PrivateSubnet1Cidr:
    Type: String
    Default: 10.240.10.0/24
  PrivateSubnet2Cidr:
    Type: String
    Default: 10.240.11.0/24

  UbuntuAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id
    Description: Canonical Ubuntu Server 24.04 LTS amd64 public SSM parameter.

  PublicApiHostname:
    Type: String
    AllowedPattern: "^(?=.{1,253}$)([a-zA-Z0-9]([a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?\\.)+[a-zA-Z]{2,63}$"
    Description: DNS name you control; its A/ALIAS record must point to the ALB and its ACM certificate must cover this name.

  AcmCertificateArn:
    Type: String
    AllowedPattern: "^arn:aws(-us-gov|-cn)?:acm:[a-z0-9-]+:[0-9]{12}:certificate/[a-f0-9-]+$"
    Description: Existing ACM certificate ARN in this region, valid for PublicApiHostname.

  ControlPlaneInstanceType:
    Type: String
    Default: t3.small
    AllowedValues: [t3.small, t3.medium, t3.large, m7i.large]
  NodeInstanceType:
    Type: String
    Default: t3.small
    AllowedValues: [t3.small, t3.medium, t3.large, c7i.large, m7i.large]
  DatabaseInstanceClass:
    Type: String
    Default: db.t4g.medium
    AllowedValues: [db.t4g.medium, db.t4g.large, db.m7g.large, db.m7g.xlarge]
  PostgresEngineVersion:
    Type: String
    Default: "16.15"
    AllowedPattern: "^16\\.[0-9]+$"
    Description: Pin the PostgreSQL 16 major line used by the Control Plane CI integration tests.

  DatabaseAllocatedStorage:
    Type: Number
    Default: 100
    MinValue: 20
    MaxValue: 1000
  DatabaseMultiAZ:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Multi-AZ improves staging resilience and increases cost.

  WireGuardListenPort:
    Type: Number
    Default: 51820
    MinValue: 1
    MaxValue: 65535

  NodePublicIngressCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: Restrict to known test-client public IP ranges when feasible.

Conditions:
  UseMultiAZDatabase: !Equals [!Ref DatabaseMultiAZ, "true"]

Resources:
  StagingVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-vpc"
        - Key: Project
          Value: ZEUS
        - Key: Environment
          Value: staging

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-igw"
        - Key: Project
          Value: ZEUS
        - Key: Environment
          Value: staging

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref StagingVpc
      InternetGatewayId: !Ref InternetGateway

  StagingPrivateHostedZone:
    Type: AWS::Route53::HostedZone
    Properties:
      Name: !Sub "${EnvironmentName}.internal"
      VPCs:
        - VPCId: !Ref StagingVpc
          VPCRegion: !Ref AWS::Region
      HostedZoneConfig:
        Comment: !Sub "Private service discovery for ${EnvironmentName}"

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref StagingVpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Ref PublicSubnet1Cidr
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-public-a"
        - Key: Environment
          Value: staging

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref StagingVpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Ref PublicSubnet2Cidr
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-public-b"
        - Key: Environment
          Value: staging

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref StagingVpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Ref PrivateSubnet1Cidr
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-private-a"
        - Key: Environment
          Value: staging

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref StagingVpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Ref PrivateSubnet2Cidr
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-private-b"
        - Key: Environment
          Value: staging

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref StagingVpc
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-public-routes"

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  NatEip:
    Type: AWS::EC2::EIP
    DependsOn: VpcGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-nat-eip"
        - Key: Environment
          Value: staging

  NatGateway:
    Type: AWS::EC2::NatGateway
    DependsOn: PublicSubnet1RouteAssociation
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !Ref PublicSubnet1
      ConnectivityType: public
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-nat"
        - Key: Environment
          Value: staging

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref StagingVpc
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-private-routes"

  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnet1RouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet2RouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  StagingNodeSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Staging WireGuard node; only WireGuard UDP is publicly reachable.
      VpcId: !Ref StagingVpc
      SecurityGroupIngress:
        - IpProtocol: udp
          FromPort: !Ref WireGuardListenPort
          ToPort: !Ref WireGuardListenPort
          CidrIp: !Ref NodePublicIngressCidr
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-node-sg"
        - Key: Environment
          Value: staging

  StagingControlPlaneSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Private Control Plane; admin API only from ALB and node mTLS only from staging node.
      VpcId: !Ref StagingVpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref StagingAlbSecurityGroup
        - IpProtocol: tcp
          FromPort: 8443
          ToPort: 8443
          SourceSecurityGroupId: !Ref StagingNodeSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: !Ref VpcCidr
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-control-plane-sg"
        - Key: Environment
          Value: staging

  StagingAlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTPS entry point for staging Control Plane.
      VpcId: !Ref StagingVpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: !Ref VpcCidr
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-alb-sg"
        - Key: Environment
          Value: staging

  StagingDatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL reachable only from staging Control Plane.
      VpcId: !Ref StagingVpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref StagingControlPlaneSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-database-sg"
        - Key: Environment
          Value: staging

  StagingAlb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${EnvironmentName}-alb"
      Scheme: internet-facing
      Type: application
      IpAddressType: ipv4
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      SecurityGroups:
        - !Ref StagingAlbSecurityGroup
      Tags:
        - Key: Project
          Value: ZEUS
        - Key: Environment
          Value: staging

  StagingControlPlaneTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${EnvironmentName}-cp"
      VpcId: !Ref StagingVpc
      Protocol: HTTP
      Port: 8080
      TargetType: instance
      HealthCheckEnabled: true
      HealthCheckProtocol: HTTP
      HealthCheckPath: /readyz
      Matcher:
        HttpCode: "200"
      Targets:
        - Id: !Ref StagingControlPlane
          Port: 8080
      Tags:
        - Key: Environment
          Value: staging

  StagingHttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref StagingAlb
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref AcmCertificateArn
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref StagingControlPlaneTargetGroup

  StagingDatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnets for ZEUS staging PostgreSQL.
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-db-subnets"
        - Key: Environment
          Value: staging

  StagingDatabase:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub "${EnvironmentName}-postgres"
      Engine: postgres
      EngineVersion: !Ref PostgresEngineVersion
      DBName: zeus_staging
      MasterUsername: zeus_staging_admin
      ManageMasterUserPassword: true
      DBInstanceClass: !Ref DatabaseInstanceClass
      AllocatedStorage: !Ref DatabaseAllocatedStorage
      StorageType: gp3
      StorageEncrypted: true
      PubliclyAccessible: false
      MultiAZ: !If [UseMultiAZDatabase, true, false]
      BackupRetentionPeriod: 7
      AutoMinorVersionUpgrade: true
      CopyTagsToSnapshot: true
      DeletionProtection: true
      DBSubnetGroupName: !Ref StagingDatabaseSubnetGroup
      VPCSecurityGroups:
        - !GetAtt StagingDatabaseSecurityGroup.GroupId
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-postgres"
        - Key: Project
          Value: ZEUS
        - Key: Environment
          Value: staging

  StagingControlPlaneRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: ReadOnlyOwnStagingDatabaseSecret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                Resource: !GetAtt StagingDatabase.MasterUserSecret.SecretArn
      Tags:
        - Key: Project
          Value: ZEUS
        - Key: Environment
          Value: staging

  StagingNodeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - Key: Project
          Value: ZEUS
        - Key: Environment
          Value: staging

  StagingControlPlaneInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref StagingControlPlaneRole

  StagingNodeInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref StagingNodeRole

  StagingControlPlanePrivateRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref StagingPrivateHostedZone
      Name: !Sub "control-plane.${EnvironmentName}.internal."
      Type: A
      TTL: "60"
      ResourceRecords:
        - !GetAtt StagingControlPlane.PrivateIp

  StagingControlPlane:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref UbuntuAmiId
      InstanceType: !Ref ControlPlaneInstanceType
      IamInstanceProfile: !Ref StagingControlPlaneInstanceProfile
      SubnetId: !Ref PrivateSubnet1
      SecurityGroupIds:
        - !Ref StagingControlPlaneSecurityGroup
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 1
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 30
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-control-plane"
        - Key: Project
          Value: ZEUS
        - Key: Environment
          Value: staging

  StagingVpnNode:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref UbuntuAmiId
      InstanceType: !Ref NodeInstanceType
      IamInstanceProfile: !Ref StagingNodeInstanceProfile
      NetworkInterfaces:
        - DeviceIndex: "0"
          SubnetId: !Ref PublicSubnet1
          AssociatePublicIpAddress: false
          GroupSet:
            - !Ref StagingNodeSecurityGroup
          DeleteOnTermination: true
      SourceDestCheck: false
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 1
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 30
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-vpn-node"
        - Key: Project
          Value: ZEUS
        - Key: Environment
          Value: staging

  StagingNodeElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: !Ref StagingVpnNode
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-vpn-node-eip"
        - Key: Environment
          Value: staging

Outputs:
  VpcId:
    Description: Isolated staging VPC ID.
    Value: !Ref StagingVpc
  PublicSubnetIds:
    Description: Public subnets for ALB and the staging VPN node.
    Value: !Join [",", [!Ref PublicSubnet1, !Ref PublicSubnet2]]
  PrivateSubnetIds:
    Description: Private subnets for Control Plane and PostgreSQL.
    Value: !Join [",", [!Ref PrivateSubnet1, !Ref PrivateSubnet2]]
  ControlPlaneInstanceId:
    Value: !Ref StagingControlPlane
  ControlPlanePrivateIp:
    Value: !GetAtt StagingControlPlane.PrivateIp
  LoadBalancerDnsName:
    Description: Configure PublicApiHostname as an A/ALIAS record pointing to this ALB DNS name.
    Value: !GetAtt StagingAlb.DNSName
  PublicApiUrl:
    Value: !Sub "https://${PublicApiHostname}"
  ControlPlanePrivateMtlsUrl:
    Description: Private VPC-only mTLS endpoint for the Node Agent; issue the server certificate for this DNS name.
    Value: !Sub "https://control-plane.${EnvironmentName}.internal:8443"
  ControlPlaneTargetHealthPath:
    Value: /readyz
  NodeInstanceId:
    Value: !Ref StagingVpnNode
  NodePublicIp:
    Description: Static Elastic IP used for the staging WireGuard endpoint.
    Value: !Ref StagingNodeElasticIp
  NodePrivateIp:
    Value: !GetAtt StagingVpnNode.PrivateIp
  WireGuardUdpPort:
    Value: !Ref WireGuardListenPort
  DatabaseEndpoint:
    Value: !GetAtt StagingDatabase.Endpoint.Address
  DatabasePort:
    Value: !GetAtt StagingDatabase.Endpoint.Port
  DatabaseSecretArn:
    Description: RDS-managed master secret ARN; retrieve through an approved secret-access workflow.
    Value: !GetAtt StagingDatabase.MasterUserSecret.SecretArn
